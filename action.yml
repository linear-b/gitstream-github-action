name: 'gitStream repo agent'
description: 'Public GitHub action for gitStream Continuous Merge'

inputs:
  full_repository:
    description: 'Path of full Repository'
    required: true
  head_ref:
    description: 'Head Branch Ref to checkout to'
    required: true
  base_ref:
    description: 'Base Branch Ref to checkout to'
    required: true
  client_payload:
    description: 'The client payload'
    required: true
  installation_id:
    description: 'The github app installation id'
    required: false
  resolver_url:
    description: 'Resolver url to send results to'
    required: true
  resolver_token:
    description: 'Optional token for resolver'
    required: false
  debug_mode:
    description: 'Run parser in debug mode'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # client_payload arrives as plain JSON, base64(gzip), or a reference to a server-stashed payload.
    # Later steps read fields off it in YAML expressions, which evaluate before the engine runs, so
    # resolve them here. Must stay first. CLIENT_PAYLOAD itself is passed through untouched.
    - name: Resolve payload fields
      id: payload-fields
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PAYLOAD_ARG: ${{ inputs.client_payload }}
      with:
        script: |
          const { gunzipSync } = require('zlib');
          const PAYLOAD_FETCH_TIMEOUT_MS = 10000;
          const OVERSIZED_PAYLOAD_REFERENCE = 'oversized-payload-reference';
          // Bounds a decompression bomb: gzip is asymmetric, so a ~66KB input can inflate to 50MB and
          // exhaust the runner. The largest payload seen in production is ~1.4MB, so this leaves ample
          // room while keeping the allocation finite.
          const MAX_INFLATED_PAYLOAD_BYTES = 32 * 1024 * 1024;
          const inflate = (value) => {
            const buffer = Buffer.from(value, 'base64');
            if (buffer.length < 2 || buffer[0] !== 0x1f || buffer[1] !== 0x8b) {
              return null;
            }
            try {
              return gunzipSync(buffer, { maxOutputLength: MAX_INFLATED_PAYLOAD_BYTES }).toString('utf8');
            } catch (err) {
              if (err.code === 'ERR_BUFFER_TOO_LARGE') {
                throw new Error(`payload inflates beyond ${MAX_INFLATED_PAYLOAD_BYTES} bytes; refusing to expand it`);
              }
              throw new Error(`gzip decompression failed: ${err.message}`);
            }
          };

          const parsePayload = (value) => {
            const parsed = JSON.parse(value);
            return typeof parsed === 'string' ? JSON.parse(parsed) : parsed;
          };

          const resolve = async (raw) => {
            if (raw.includes(OVERSIZED_PAYLOAD_REFERENCE)) {
              const reference = parsePayload(raw);
              if (reference && reference.type === OVERSIZED_PAYLOAD_REFERENCE) {
                core.setSecret(reference.resolverToken);
                const response = await fetch(reference.payloadUrl, {
                  headers: { Authorization: `Bearer ${reference.resolverToken}` },
                  signal: AbortSignal.timeout(PAYLOAD_FETCH_TIMEOUT_MS),
                });
                if (!response.ok) {
                  throw new Error(`stashed payload fetch returned ${response.status}`);
                }
                const body = await response.text();
                return { mode: 'reference', payload: parsePayload(inflate(body) ?? body) };
              }
            }
            const inflated = inflate(raw);
            if (inflated !== null) {
              return { mode: 'compressed', payload: parsePayload(inflated) };
            }
            return { mode: 'plain', payload: parsePayload(raw) };
          };

          try {
            const { mode, payload } = await resolve(process.env.PAYLOAD_ARG || '');
            core.info(`client_payload mode=${mode}`);

            // The installation token rides inside client_payload, so mask it before it reaches an
            // output or a later step's env dump.
            const githubToken = payload.githubToken || '';
            if (githubToken) {
              core.setSecret(githubToken);
            }
            const hasCmRepo = payload.hasCmRepo === true;
            core.setOutput('github_token', githubToken);
            core.setOutput('url', payload.headHttpUrl || payload.repoUrl || '');
            core.setOutput('has_cm_repo', String(hasCmRepo));
            core.setOutput('cm_repository', hasCmRepo ? `${payload.owner}/${payload.cmRepo}` : '');
            core.setOutput('cm_repo_ref', payload.cmRepoRef || '');
            core.setOutput('has_cm_org', String(payload.hasCmOrg === true));
            core.setOutput('cm_org_ref', payload.cmOrgRef || '');
          } catch (err) {
            core.setFailed(`Failed resolving client payload: ${err}`);
          }

    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version: 20.12.2

    - name: Create GitStream folder
      shell: bash
      run: |
        rm -rf gitstream && rm -rf code && mkdir gitstream
        cd gitstream && mkdir repo

    - name: Checkout base branch
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: ${{ inputs.full_repository }}
        ref: ${{ inputs.base_ref }}
        path: gitstream/repo/
        token: ${{ steps.payload-fields.outputs.github_token || github.token }}

    - name: Escape single quotes
      id: safe-strings
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_REF_ARG: ${{ inputs.base_ref }}
        HEAD_REF_ARG: ${{ inputs.head_ref }}
        PAYLOAD_ARG: ${{ inputs.client_payload }}
        URL_ARG: ${{ steps.payload-fields.outputs.url }}
      with:
        script: |
          try {
            function convertToSafeString(input) {
              return (input || '').replace(/['`]/g, "\\$&");
            };
            function escapeApostrophe(input) {
              return (input || '').replace(/'/g, "\\'");
            };
            const base_ref = escapeApostrophe(process.env.BASE_REF_ARG);
            const head_ref = escapeApostrophe(process.env.HEAD_REF_ARG);
            const url = convertToSafeString(process.env.URL_ARG);
            const client_payload = convertToSafeString(process.env.PAYLOAD_ARG);
            core.setOutput('base_ref', base_ref);
            core.setOutput('head_ref', head_ref);
            core.setOutput('url', url);
            core.setOutput('client_payload', client_payload);
          } catch (err) {
            core.error(`Failed producing safe string: ${err}`);
            process.exit(1);
          }

    - name: Checkout Pull Request branches history
      shell: bash
      run: |
        cd gitstream && cd repo
        git config checkout.defaultRemote origin
        git fetch --shallow-since="6 months ago" origin $'${{ steps.safe-strings.outputs.base_ref }}'
        git remote add upstream $'${{ steps.safe-strings.outputs.url }}'
        git fetch --shallow-since="6 months ago" upstream $'${{ steps.safe-strings.outputs.head_ref }}' || echo "::warning::Failed to fetch head branch. The branch may have been deleted."
        git checkout -b $'upstream/${{ steps.safe-strings.outputs.head_ref}}' $'upstream/${{ steps.safe-strings.outputs.head_ref}}' || true
        git checkout $'${{ steps.safe-strings.outputs.base_ref }}' || true
        git checkout $'${{ steps.safe-strings.outputs.head_ref }}' || true

    - name: Create cm folder
      shell: bash
      run: cd gitstream && mkdir cm

    - name: Checkout cm repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      if: ${{ steps.payload-fields.outputs.has_cm_repo == 'true' }}
      with:
        repository: ${{ steps.payload-fields.outputs.cm_repository }}
        ref: ${{ steps.payload-fields.outputs.cm_repo_ref }}
        path: gitstream/cm/
        fetch-depth: 1

    - name: Checkout cm org
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      if: ${{ steps.payload-fields.outputs.has_cm_org == 'true' }}
      with:
        repository: 'cm/cm'
        ref: ${{ steps.payload-fields.outputs.cm_org_ref }}
        path: gitstream/cm/
        fetch-depth: 1

    - name: Volume folder
      shell: bash
      run: mv gitstream code

    - name: Run RulesEngine
      shell: bash
      run: node ${{ github.action_path }}/dist/index.js
      env:
        NODE_PATH: ${{ github.action_path }}/dist/node_modules
        HEAD_REF: ${{ steps.safe-strings.outputs.head_ref }}
        BASE_REF: ${{ steps.safe-strings.outputs.base_ref }}
        CLIENT_PAYLOAD: ${{ steps.safe-strings.outputs.client_payload }}
        RULES_RESOLVER_URL: ${{ inputs.resolver_url }}
        RULES_RESOLVER_TOKEN: ${{ inputs.resolver_token }}
        DEBUG_MODE: ${{ inputs.debug_mode }}
        ENABLE_DEBUG_ARTIFACTS: ${{ env.ENABLE_DEBUG_ARTIFACTS }}
        RUN_ID: ${{ github.run_id }}

    - name: Upload artifacts
      if: ${{ env.ENABLE_DEBUG_ARTIFACTS == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        retention-days: 7
        name: output
        path: code/output
